[package]
name = "codegen-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
panel-codegen = { path = "../../../ym38x6-ui/panel-codegen" }
# wasm-bindgen-cli（ビルド時に別途インストールするツール）とクレートのバージョンは完全一致が
# 必須なため厳密ピン。上げる場合は `cargo install wasm-bindgen-cli --version <同じ値> --force` も必要
# （gesture-app/editor-wasmと同じ運用、同じバージョンを共有する）。
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "s"
lto = true
