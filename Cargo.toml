[workspace]
members = [
    "sound-core",
    "ym38x6-core",
    "ym38x6-vst",
    "gesture-app/src-tauri",
    "tools/psr2x6",
    "tools/mucom2x6",
    "tools/opm2x6",
    "tools/wavetest",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
