[package]
name = "ym38x6-ml"
version = "0.1.0"
edition = "2021"
publish = false

# フェーズ6: ML逆算合成（インバース合成）用。38x6 FMエンジンのPythonバインディングを
# PyO3で提供し、Python側からランダムサンプリングで (パラメーター, 音響特徴) データセットを
# 生成・学習できるようにする。tools/ 配下だが他ツール（純Rust CLI・workspaceメンバー）と異なり、
# PyO3拡張モジュール（cdylib）かつworkspace除外（root Cargo.toml の exclude 参照）。ビルドはmaturin専任。

[lib]
name = "ym38x6_ml"
crate-type = ["cdylib"]

[dependencies]
ym38x6-core = { path = "../../ym38x6-core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
serde_json = "1"
