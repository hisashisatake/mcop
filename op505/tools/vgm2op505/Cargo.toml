[package]
name = "vgm2op505"
version = "0.1.0"
edition = "2021"

[lib]
name = "vgm2op505"
path = "src/lib.rs"

[[bin]]
name = "vgm2op505"
path = "src/main.rs"

[dependencies]
opm2op505 = { path = "../opm2op505" }
mucom2op505 = { path = "../mucom2op505" }
op505-core = { path = "../../core" }
sound-core = { path = "../../../sound/core" }
op505-tools = { path = "../common" }
flate2 = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
