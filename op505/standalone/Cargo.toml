[package]
name = "op505-standalone"
version = "0.1.0"
edition = "2021"

# op505をDomino等のMME専用MIDIシーケンサから直接鳴らすための常駐アプリ。
# このアプリ自身は新規の仮想MIDIポートを作らない。loopMIDI等の既存の仮想/実MIDI入力
# ポートをmidir経由で開き、そこから来たMIDIをop505-coreへ渡してcpalでWASAPI直出しする。
# CC/NRPN・プログラムチェンジ解釈（Step 3）はop505-midiの`ChannelState`を参照する
# （op505-vst/smf2op505に続く3本目の利用側。GM2リズムチャンネルは未対応、旋律のみ）。

[[bin]]
name = "op505-standalone"
path = "src/main.rs"

[dependencies]
op505-core = { path = "../core" }
op505-midi = { path = "../midi" }
op505-editor = { path = "../editor" }
op505-ui = { path = "../ui" }
ui-core = { path = "../../ui/core" }
sound-core = { path = "../../sound/core" }
sound-midi = { path = "../../sound/midi" }
midir = "0.11"
cpal = "0.15"
# 設定ファイル（%APPDATA%\op505\standalone.json）用。op505-coreの.op505プリセット形式と
# 同じserde+serde_json（op505/core/Cargo.toml参照）に揃える。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# タスクトレイ常駐化用。winitは引き込まず、生のWin32メッセージループ（tray.rs参照）と
# 組み合わせて使う。
tray-icon = "0.24"
# トレイ起動の音色エディタ（Step 1）用。`op505/tools/xml-panel-dsl/preview-native`と同じ
# 構成（glow+default_fonts、winit依存）。tray.rsのGetMessageWループとは別スレッドで
# `EventLoopBuilderExtWindows::with_any_thread(true)`により起動する（`editor`モジュール参照）。
# このクレートはワークスペースメンバーのため`cargo check --workspace`にwinit/glowが混ざる
# トレードオフを受け入れている（要否は導入時にユーザー確認済み）。
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.34"
winit = "0.30"
rfd = "0.15"
