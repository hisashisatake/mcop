[workspace]
members = [
    "sound/core",
    "sound/fm",
    "ui/core",
    "ui/layout",
    "ui/codegen",
    "op505/core",
    "op505/midi",
    "op505/ui",
    "op505/vst",
    "gesture-app/src-tauri",
    "op505/tools/common",
    "op505/tools/opzref",
    "op505/tools/wavetest",
    "op505/tools/opz2op505",
    "op505/tools/psr2op505",
    "op505/tools/mucom2op505",
    "op505/tools/opm2op505",
    "op505/tools/vgm2op505",
    "op505/tools/smf2op505",
    "op505/tools/latency-probe",
    "op505/tools/loopback-record",
    "op505/standalone",
]
# op505/tools/patchlab はPyO3拡張モジュール（cdylib）。共有ワークスペースの profile.release（panic=abort）
# やpython/pyo3リンク要求を `cargo check --workspace` 等に持ち込まないため、ワークスペースから
# 除外して独立クレートとして扱う（ビルドはmaturin専任、op505-coreはpath依存で参照）。
# op505/mme-driver も同じ理由（cdylib、panic=abort禁止）でexclude。ただしこちらは
# Domino等の相手アプリのプロセスにロードされるユーザーモードMMEドライバDLLで、
# パニックを外へ伝播させるとホストアプリごと落ちるため独立clate自身がpanic="unwind"を持つ
# （ビルドはx86_64-pc-windows-msvc/i686-pc-windows-msvc向けに個別。詳細はop505/mme-driver/Cargo.toml）。
# op505/ui/preview-wasm はwasm32-unknown-unknown専用クレート（wasm-bindgen依存）。
# ホストターゲット(x86_64-pc-windows-msvc)ではビルドできずcargo check --workspaceを
# 壊すため除外。ビルドはrustup配下のcargo（wasm32ターゲット導入済み）で個別に行う
# （op505-ui/ui-codegen をpath依存で参照する。gesture-app/editor-wasmは
# gesture-appのMIDI送信化に伴い2026-09-01に削除済み、CLAUDE.md gesture-app節参照）。
# op505/tools/xml-panel-dsl/preview-native はeframe nativeのxml-panel-dslプレビュー用GUIツール
# （分離・ドッキング可能なプレビュー等、preview-wasm＝ブラウザ版では実現できない機能向け）。
# winit/glow等の重い依存を`cargo check --workspace`に持ち込まないため除外し、
# scoop版の既定cargoで個別にビルドする（preview-wasmと同じop505-ui(preview feature)/ui-codegen
# をpath依存で参照するが、wasm32は不要）。
# sound/{core,fm}・ui/{core,layout,codegen} は製品非依存の共有クレート群
# （ディレクトリ=グループ、パッケージ名は<group>-<part>。op505配下と同じ規約）。
# op505/tools/common（op505-tools）は製品非依存ではなく、op505ツール群専用の共有クレート。
exclude = [
    "op505/tools/patchlab",
    "op505/ui/preview-wasm",
    "op505/tools/xml-panel-dsl/preview-native",
    "op505/mme-driver",
]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
