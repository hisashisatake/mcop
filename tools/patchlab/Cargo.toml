[package]
name = "patchlab"
version = "0.1.0"
edition = "2021"
publish = false

# 38x6 FMエンジンのPythonバインディング。音色設計・試聴・分析ツール群（patchlab）から
# Python経由でエンジンを呼べるようにするPyO3拡張モジュール。元々はML逆算合成（フェーズ6）
# 専用だったが、手動音色設計テンプレート（piano/brass/organ_template等）や試聴ツールも
# 同梱するようになったため改称した。tools/ 配下だが他ツール（純Rust CLI・workspaceメンバー）
# と異なり、PyO3拡張モジュール（cdylib）かつworkspace除外（root Cargo.toml の exclude 参照）。
# ビルドはmaturin専任。

[lib]
name = "patchlab"
crate-type = ["cdylib"]

[dependencies]
ym38x6-core = { path = "../../ym38x6-core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
serde_json = "1"
