[package]
name = "wavetest"
version = "0.1.0"
edition = "2021"
publish = false

# 非サイン波形（OPZ系 waveform 1〜7）をFMのキャリア/モジュレーターに使ったときの
# 音色変化を試聴で確認するための開発ツール。
# 8系統の基本音色 × 波形バリエーションを .38x6 バンクとWAVへ書き出す。
# ym38x6-core の正規型(Ym38x6Patch/PresetFile)とエンジンを再利用する。

[[bin]]
name = "wavetest"
path = "src/main.rs"

[dependencies]
ym38x6-core = { path = "../../core" }
