[package]
name = "op505-standalone"
version = "0.1.0"
edition = "2021"

# op505をDomino等のMME専用MIDIシーケンサから直接鳴らすための常駐アプリ。
# このアプリ自身は新規の仮想MIDIポートを作らない。loopMIDI等の既存の仮想/実MIDI入力
# ポートをmidir経由で開き、そこから来たMIDIをop505-coreへ渡してcpalでWASAPI直出しする。
# CC/NRPN・プログラムチェンジ解釈（Step 3）はop505-midiの`ChannelState`を参照する
# （op505-vst/smf2op505に続く3本目の利用側。GM2リズムチャンネルは未対応、旋律のみ）。

[[bin]]
name = "op505-standalone"
path = "src/main.rs"

[dependencies]
op505-core = { path = "../core" }
op505-midi = { path = "../midi" }
sound-core = { path = "../../sound/core" }
midir = "0.11"
cpal = "0.15"
