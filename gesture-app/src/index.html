<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>OP505 作曲支援</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: monospace; overflow: hidden; user-select: none; }

    #canvas { display: block; cursor: crosshair; }

    /* 左下: コード名 */
    #hud {
      position: fixed; bottom: 28px; left: 32px;
      pointer-events: none;
    }
    #chord-display {
      font-size: 80px; font-weight: bold; color: #fff; line-height: 1;
      text-shadow: 0 0 40px rgba(120,200,255,0.4);
      letter-spacing: -2px;
    }
    #program-panel select#key-tonic {
      width: 56px;
    }

    /* 右上: ヒント */
    #hint {
      position: fixed; top: 14px; right: 18px;
      font-size: 12px; color: #444; text-align: right; line-height: 2;
    }

    /* 右上ヒントの下: 直近のMIDI送信ログ（実機確認用のデバッグ表示） */
    #midi-log-panel {
      position: fixed; top: 92px; right: 18px;
      width: 300px; max-height: 240px;
      font-size: 10px; color: #5a7; letter-spacing: 0;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid #2a2a2a;
      padding: 6px 8px;
      overflow-y: auto;
      pointer-events: none;
    }
    #midi-log-panel .midi-log-title {
      color: #666; font-size: 10px; letter-spacing: 2px; margin-bottom: 4px;
    }
    #midi-log {
      white-space: pre-wrap;
      margin: 0;
      line-height: 1.5;
    }

    /* 右下: 音源モード切替（波形メモリ/Bank,Program）とProgram切り替え（動作確認用の簡易UI） */
    #program-panel {
      position: fixed; bottom: 16px; right: 16px;
      font-size: 12px; color: #888;
      display: flex; flex-direction: column; gap: 6px;
    }
    #program-panel .program-row {
      display: flex; align-items: center; gap: 6px;
    }
    #program-panel .program-row:first-child {
      justify-content: space-between;
    }
    #program-panel input[type="number"] {
      width: 64px; background: #222; color: #eee; border: 1px solid #444;
      font-family: monospace; font-size: 12px; padding: 2px 4px;
    }
    #program-panel input[type="number"]:disabled {
      opacity: 0.4;
    }
    #program-panel select {
      background: #222; color: #eee; border: 1px solid #444;
      font-family: monospace; font-size: 12px; padding: 2px 4px;
    }
    #program-panel label {
      display: flex; align-items: center; gap: 4px; cursor: pointer;
    }
    #program-label {
      color: #aaa; text-align: right;
    }
    #tempo-display {
      color: #aaa;
    }
    #program-panel button {
      background: #222; color: #eee; border: 1px solid #444;
      font-family: monospace; font-size: 12px; padding: 2px 8px; cursor: pointer;
    }
    #program-panel button:active {
      background: #3a5; color: #fff; border-color: #3a5;
    }

    /* 右下の手動リサイズグリップ。Tauri/WebView2側の既知の不具合
       （tauri-apps/tauri#9023、装飾ウィンドウの右端・下端(East/South)のドラッグが
       NCHITTESTを素通りしリサイズできない。左端・上端(West/North)は正常）の回避策として、
       startResizeDragging()を明示的に呼び出すハンドルを自前で描く。
       単一方向（'East'/'South'単体）は実機検証でstartResizeDragging自体が反応しないと
       判明したため使わず、'SouthEast'（斜め）のみ使用する——横だけ・縦だけ動かせば
       事実上その方向だけのリサイズとして機能する。 */
    #resize-grip {
      position: fixed; right: 0; bottom: 0;
      width: 22px; height: 22px;
      cursor: nwse-resize;
      z-index: 20;
      background-image: repeating-linear-gradient(
        135deg, #555 0 2px, transparent 2px 5px
      );
      -webkit-mask-image: linear-gradient(135deg, transparent 40%, #000 40%);
    }
    #resize-grip:hover {
      background-image: repeating-linear-gradient(
        135deg, #999 0 2px, transparent 2px 5px
      );
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="program-panel">
    <div class="program-row">
      <label><input type="checkbox" id="waveform-memory-toggle"> 波形メモリ</label>
      <span id="program-label"></span>
    </div>
    <div class="program-row">
      Bank <input type="number" id="program-bank" value="0" min="0" max="16383">
      Program <input type="number" id="program-num" value="0" min="0" max="127">
    </div>
    <div class="program-row">
      <button id="tap-tempo-btn" type="button">TAP</button>
      <span id="tempo-display">120 BPM</span>
    </div>
    <div class="program-row">
      Key <select id="key-tonic"></select>
      Cols <input type="number" id="grid-cols" value="13" min="3" max="25" step="2">
    </div>
    <div class="program-row">
      <label><input type="checkbox" id="show-chord-names"> コード名表示</label>
    </div>
  </div>

  <div id="hud">
    <div id="chord-display">—</div>
  </div>

  <div id="hint">
    クリック: 発音（セル上側ほど強く） &nbsp;|&nbsp; Shift: 4和音レイヤー<br>
    ホイール: LFO Depth &nbsp;|&nbsp; V: Vibrato/Tremolo切替<br>
    C/B: LFO Rate down/up &nbsp;|&nbsp; E: 音色エディタ
  </div>

  <div id="midi-log-panel">
    <div class="midi-log-title">MIDI LOG</div>
    <pre id="midi-log"></pre>
  </div>

  <div id="resize-grip" title="ドラッグで幅・高さをリサイズ（横だけ/縦だけの移動でその方向のみ変更）"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
