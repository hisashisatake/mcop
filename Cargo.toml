[workspace]
members = [
    "sound-core",
    "ym38x6-core",
    "ym38x6-ui",
    "ym38x6-ui/panel-layout",
    "ym38x6-ui/panel-codegen",
    "ym38x6-vst",
    "gesture-app/src-tauri",
    "tools/psr2x6",
    "tools/mucom2x6",
    "tools/opm2x6",
    "tools/opz2x6",
    "tools/opzref",
    "tools/smf2wav",
    "tools/wavetest",
    "tools/vgm2x6",
]
# tools/patchlab はPyO3拡張モジュール（cdylib）。共有ワークスペースの profile.release（panic=abort）
# やpython/pyo3リンク要求を `cargo check --workspace` 等に持ち込まないため、ワークスペースから
# 除外して独立クレートとして扱う（ビルドはmaturin専任、ym38x6-coreはpath依存で参照）。
# gesture-app/editor-wasm・tools/xml-panel-dsl/codegen-wasm はwasm32-unknown-unknown専用クレート
# （wasm-bindgen依存）。ホストターゲット(x86_64-pc-windows-msvc)ではビルドできず
# cargo check --workspaceを壊すため除外。ビルドはrustup配下のcargo（wasm32ターゲット導入済み）で
# 個別に行う（editor-wasmはym38x6-uiを、codegen-wasmはym38x6-ui/panel-codegenをpath依存で参照）。
exclude = ["tools/patchlab", "gesture-app/editor-wasm", "tools/xml-panel-dsl/codegen-wasm"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
