[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "patchlab"
version = "0.1.0"
description = "38x6 FM engine Python binding for patch design / audition / ML inverse synthesis tools"
requires-python = ">=3.12"
dependencies = [
    "numpy",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Cargo.toml の [lib] name = patchlab が import 名になる。abi3-py312 ビルド。
features = ["pyo3/extension-module"]
